name: autofix.ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: install-pinned/ruff@1c3c40a7d643eede9098ee34200cf5b6ead45fe2
      - run: ruff --fix-only .
      - run: ruff format .

      - name: Run prettier
        run: |
          npm ci
          npm run prettier
        working-directory: web

      - uses: mhils/add-pr-ref-in-changelog@main

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
